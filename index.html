<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍰 Control de Postres</title>
  <style>
    /* ---------- SOFT UI - Neumorphism + Claymorphism ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body {
      background: #F2F2F2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
    }
    .login-card {
      background: #F2F2F2;
      border-radius: 30px;
      padding: 40px 30px;
      box-shadow: 12px 12px 24px #d1d1d1, -12px -12px 24px #ffffff;
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.3s;
    }
    .login-card h1 {
      text-align: center;
      color: #9C8BD9;
      margin-bottom: 10px;
      font-size: 2rem;
    }
    .login-card .subtitle {
      text-align: center;
      color: #B4A3D9;
      margin-bottom: 30px;
      font-weight: 300;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 500;
    }
    .input-group input {
      width: 100%;
      padding: 14px 20px;
      border: none;
      background: #F2F2F2;
      border-radius: 20px;
      box-shadow: inset 6px 6px 12px #d1d1d1, inset -6px -6px 12px #ffffff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
    }
    .input-group input:focus {
      box-shadow: inset 4px 4px 8px #d1d1d1, inset -4px -4px 8px #ffffff;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: #F2B3D6;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 8px 8px 16px #d1d1d1, -8px -8px 16px #ffffff;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn-login:active {
      box-shadow: inset 6px 6px 12px #d1d1d1, inset -6px -6px 12px #ffffff;
      transform: scale(0.98);
    }
    .error-msg {
      color: #e74c3c;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
    .dashboard {
      display: none;
      width: 100%;
      max-width: 1200px;
      padding: 20px;
    }
    .mensaje-prueba {
      text-align: center;
      color: #9C8BD9;
      margin-top: 30px;
    }
    .btn-logout {
      display: inline-block;
      padding: 10px 30px;
      border: none;
      border-radius: 30px;
      background: #B4A3D9;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 8px 8px 16px #d1d1d1, -8px -8px 16px #ffffff;
      transition: all 0.2s;
      margin-top: 20px;
    }
    .btn-logout:active {
      box-shadow: inset 6px 6px 12px #d1d1d1, inset -6px -6px 12px #ffffff;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- ========== PANTALLA DE LOGIN ========== -->
  <div class="login-container" id="loginContainer">
    <div class="login-card">
      <h1>🍰 Postres</h1>
      <p class="subtitle">Administración</p>
      <div class="input-group">
        <label>👤 Usuario</label>
        <input type="text" id="username" placeholder="Ingresa tu usuario" value="admin">
      </div>
      <div class="input-group">
        <label>🔒 Contraseña</label>
        <input type="password" id="password" placeholder="••••••" value="123">
      </div>
      <button class="btn-login" id="loginBtn">Ingresar</button>
      <div id="loginError" class="error-msg"></div>
    </div>
  </div>

  <!-- ========== DASHBOARD ========== -->
  <div class="dashboard" id="dashboard">
    <h1>Bienvenido, <span id="userDisplay"></span></h1>
    <p class="mensaje-prueba">✅ Login exitoso. Aquí irán los módulos.</p>
    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
  </div>

  <script>
    // ============================================================
    // CONFIGURACIÓN - REEMPLAZA TU URL DE APPS SCRIPT
    // ============================================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzz_b67cTZa76vrmRpMual4dBY1QAHzFO0QvEH-_Z8DR-atf-rIXJlFMy8NCQLbDQ2Kcw/exec'; // <--- CAMBIA ESTA URL POR LA NUEVA

    // Usamos corsproxy.io como proxy para evitar CORS
    const BACKEND_URL = 'https://corsproxy.io/?' + encodeURIComponent(SCRIPT_URL);

    // --- FUNCIÓN PARA LLAMAR AL BACKEND ---
    async function callBackend(action, data = {}) {
      try {
        const payload = { action, ...data };
        console.log('Enviando petición a:', BACKEND_URL);
        console.log('Payload:', payload);

        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        console.log('Respuesta status:', response.status);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        console.log('Resultado:', result);
        return result;
      } catch (error) {
        console.error('Error en callBackend:', error);
        return { success: false, message: error.message };
      }
    }

    // --- LOGIN ---
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const usuario = document.getElementById('username').value.trim();
      const contraseña = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('loginError');

      if (!usuario || !contraseña) {
        errorDiv.textContent = 'Por favor completa todos los campos';
        return;
      }

      errorDiv.textContent = 'Validando...';

      const result = await callBackend('login', { usuario, contraseña });
      console.log('Resultado login:', result);

      if (result.success) {
        errorDiv.textContent = '';
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('userDisplay').textContent = result.data.usuario;
        cargarDatosIniciales();
      } else {
        errorDiv.textContent = result.message || 'Error al iniciar sesión';
      }
    });

    // --- CERRAR SESIÓN ---
    function logout() {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginContainer').style.display = 'flex';
      document.getElementById('password').value = '';
      document.getElementById('loginError').textContent = '';
    }

    // --- FUNCIÓN PARA CARGAR DATOS INICIALES ---
    async function cargarDatosIniciales() {
      console.log('Cargando datos iniciales...');
      // Puedes probar otras acciones como getPuntos
      // const puntos = await callBackend('getPuntos');
      // console.log('Puntos:', puntos);
    }

    // --- PERMITIR ENTER PARA LOGIN ---
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>

</body>
</html>
